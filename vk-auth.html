<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в Пульсар — VK ID</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 20px 20px;background:#f5f7fb;color:#17263b;font:13px Arial,sans-serif}
.brand{font-size:10px;letter-spacing:2px;font-weight:800;color:#29496d;margin-bottom:15px}
h1{font-size:18px;margin:0 0 7px}
p{font-size:12px;line-height:1.5;color:#65758b;margin:0 0 16px}
#vkOneTap{min-height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
#vkOneTap iframe{max-width:100%}
.divider{display:flex;align-items:center;gap:9px;color:#98a4b4;font-size:10px;margin:13px 0}
.divider:before,.divider:after{content:"";height:1px;background:#dce3ed;flex:1}
button{width:100%;border:0;border-radius:10px;padding:12px;background:#2787f5;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#status{font-size:11px;line-height:1.45;color:#8290a2;margin-top:13px;min-height:28px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@vkid/sdk@2.6.1/dist-sdk/umd/index.js"></script>
</head>
<body>
<div class="brand">PULSAR / VK ID</div>
<h1>Вход в Пульсар</h1>
<p>Войди через официальный сервис VK ID. После подтверждения окно авторизации вернётся в Пульсар.</p>
<div id="vkOneTap"></div>
<div class="divider">ИЛИ</div>
<button id="login" type="button" disabled>Загрузка VK ID…</button>
<div id="status" role="status">Подготавливаем безопасное соединение…</div>
<script>
(()=>{
 const status=document.getElementById('status'),button=document.getElementById('login');
 let config=null,initialized=false,channel=null,widget=null;
 const setStatus=value=>status.textContent=value;
 const sendCode=response=>{
  if(!response?.code||!response?.device_id)throw new Error('VK ID не вернул код авторизации');
  const message={type:'PULSAR_VK_AUTH_CODE',nonce:config.nonce,code:response.code,device_id:response.device_id,codeVerifier:config.codeVerifier,state:config.state};
  window.parent.postMessage(message,location.origin);
  if(channel)channel.postMessage(message);
  button.disabled=true;button.textContent='Авторизация завершена';
  setStatus('Вход подтверждён. Возвращаемся в Пульсар…');
 };
 const init=()=>{
  if(initialized||!config||!window.VKIDSDK)return;
  initialized=true;
  try{
   const SDK=window.VKIDSDK;
   diag('SDK_CONFIG_INIT_START',{appId:config.appId,redirectUrl:config.redirectUrl,mode:'Redirect'});
   SDK.Config.init({app:config.appId,redirectUrl:config.redirectUrl,state:config.state,codeVerifier:config.codeVerifier,mode:SDK.ConfigAuthMode.Redirect,responseMode:SDK.ConfigResponseMode.Callback});
   diag('SDK_CONFIG_INIT_OK');
   button.disabled=false;button.textContent='Продолжить через VK ID';diag('FALLBACK_LOGIN_READY');
   button.addEventListener('click',async()=>{
    button.disabled=true;button.textContent='Ожидаем подтверждение…';setStatus('Открой окно VK ID и подтверди вход');
    try{diag('AUTH_LOGIN_STARTED',{mode:'Redirect'});await SDK.Auth.login({lang:'ru'});diag('AUTH_LOGIN_REDIRECT_RETURNED')}
    catch(error){diag('AUTH_LOGIN_FAILED',{name:error?.name,message:error?.message,code:error?.code,text:error?.text});console.error('VK ID auth-page login failed:',error);setStatus('Не удалось завершить вход: '+(error?.message||error?.text||'ошибка VK ID'));button.disabled=false;button.textContent='Повторить вход'}
   });
   try{
    diag('ONETAP_RENDER_START');widget=new SDK.OneTap().render({container:document.getElementById('vkOneTap'),scheme:SDK.Scheme.LIGHT,lang:SDK.Languages.RUS,showAlternativeLogin:true});diag('ONETAP_RENDER_RETURNED',{widgetPresent:!!widget});
    widget.on(SDK.WidgetEvents.LOAD,()=>{diag('ONETAP_LOAD_EVENT');setStatus('VK ID готов. Выбери способ входа.')});
    const loginSuccessEvent=SDK.OneTapInternalEvents?.LOGIN_SUCCESS;
    if(loginSuccessEvent){
     widget.on(loginSuccessEvent,payload=>{
      diag('ONETAP_LOGIN_SUCCESS',{hasCode:!!payload?.code,hasDeviceId:!!payload?.device_id,keys:payload&&typeof payload==='object'?Object.keys(payload):[]});
      try{sendCode(payload)}catch(error){diag('ONETAP_RESULT_INVALID',{name:error?.name,message:error?.message});console.error('VK OneTap returned an invalid auth payload:',error);setStatus('VK ID не вернул данные для завершения входа. Используй кнопку ниже.')}
     });
     diag('ONETAP_LOGIN_SUCCESS_HANDLER_READY',{event:loginSuccessEvent});
    }else{
     diag('ONETAP_LOGIN_SUCCESS_EVENT_MISSING',{availableEvents:SDK.OneTapInternalEvents?Object.keys(SDK.OneTapInternalEvents):[]});
    }
    widget.on(SDK.WidgetEvents.ERROR,error=>{diag('ONETAP_ERROR',{code:error?.code,text:error?.text,message:error?.message});console.warn('VK OneTap auth-page widget error:',error);setStatus('Виджет OneTap не ответил ('+(error?.text||'ошибка')+'). Используй кнопку ниже.')});
   }catch(error){diag('ONETAP_RENDER_FAILED',{name:error?.name,message:error?.message});console.warn('VK OneTap auth-page render failed:',error);setStatus('Виджет недоступен. Используй кнопку ниже.')}
  }catch(error){diag('SDK_CONFIG_INIT_FAILED',{name:error?.name,message:error?.message});console.error('VK ID auth-page init failed:',error);setStatus('Ошибка настройки VK ID: '+(error?.message||String(error)))}
 };
 const diag=(step,details={})=>{
  const entry={time:new Date().toISOString(),step,details};
  console.info('[PULSAR VK AUTH PAGE]',entry);
  setStatus(step+' — '+JSON.stringify(details));
  try{window.parent.postMessage({type:'PULSAR_VK_DIAG',step,details},location.origin)}catch{}
  try{channel?.postMessage({type:'PULSAR_VK_DIAG',step,details})}catch{}
 };
 diag('AUTH_PAGE_SCRIPT_STARTED',{href:location.href,origin:location.origin,referrer:document.referrer,readyState:document.readyState,sdkPresent:!!window.VKIDSDK});
 const callbackParams=new URLSearchParams(location.search);
 const callbackChannel=callbackParams.get('channel');
 const callbackCode=callbackParams.get('code');
 const callbackDeviceId=callbackParams.get('device_id');
 const callbackState=callbackParams.get('state');
 if(callbackChannel&&callbackCode&&callbackDeviceId&&callbackState&&/^[a-zA-Z0-9_-]{20,100}$/.test(callbackChannel)){
  try{
   const saved=sessionStorage.getItem('pulsarVkAuthConfig:'+callbackChannel);
   const restored=saved?JSON.parse(saved):null;
   if(restored&&restored.state===callbackState&&restored.channelName===callbackChannel){
    config=restored;
    diag('OAUTH_REDIRECT_CALLBACK_RECEIVED',{hasCode:true,hasDeviceId:true,stateMatches:true});
   }else{
    diag('OAUTH_REDIRECT_CALLBACK_REJECTED',{hasSavedConfig:!!restored,stateMatches:restored?.state===callbackState,channelMatches:restored?.channelName===callbackChannel});
   }
  }catch(error){diag('OAUTH_REDIRECT_CALLBACK_RESTORE_FAILED',{message:error.message})}
 }
 const channelName=new URLSearchParams(location.search).get('channel');
 if(channelName&&/^[a-zA-Z0-9_-]{20,100}$/.test(channelName)){
  try{
   channel=new BroadcastChannel(channelName);
   channel.onmessage=event=>{
    const data=event.data;
    if(!data||data.type!=='PULSAR_VK_INIT'){if(data?.type==='PULSAR_VK_DIAG')return;diag('CHANNEL_MESSAGE_IGNORED',{type:data?.type||null});return}
    const expectedRedirect=location.origin+'/vk-auth?channel='+encodeURIComponent(channelName);
    if(!data.nonce||!data.state||!data.codeVerifier||data.channelName!==channelName||data.redirectUrl!==expectedRedirect){diag('INIT_REJECTED_INVALID_CONFIG',{hasNonce:!!data.nonce,hasState:!!data.state,hasVerifier:!!data.codeVerifier,channelMatches:data.channelName===channelName,redirectMatches:data.redirectUrl===expectedRedirect});return}
    config=data;
    try{sessionStorage.setItem('pulsarVkAuthConfig:'+channelName,JSON.stringify(config))}catch(error){diag('AUTH_CONFIG_PERSIST_FAILED',{message:error.message})}
    diag('INIT_ACCEPTED',{channelName,redirectUrl:data.redirectUrl,mode:'Redirect'});init();
   };
   diag('BROADCAST_CHANNEL_LISTENING',{channelName});
  }catch(error){diag('BROADCAST_CHANNEL_FAILED',{name:error.name,message:error.message})}
 }else diag('INVALID_OR_MISSING_CHANNEL_QUERY',{hasChannel:!!channelName});
 if(config&&callbackCode&&callbackDeviceId&&callbackState){
  try{
   const response={code:callbackCode,device_id:callbackDeviceId,state:callbackState};
   sendCode(response);
   sessionStorage.removeItem('pulsarVkAuthConfig:'+channelName);
   diag('OAUTH_REDIRECT_CODE_FORWARDED',{hasCode:true,hasDeviceId:true});
  }catch(error){diag('OAUTH_REDIRECT_FORWARD_FAILED',{name:error.name,message:error.message});setStatus('Не удалось передать результат входа в Пульсар.')}
 }

 const sdk=document.querySelector('script[src*="@vkid/sdk"]');
 if(sdk){
  sdk.addEventListener('load',()=>{diag('SDK_LOAD_EVENT',{sdkPresent:!!window.VKIDSDK});init()});
  sdk.addEventListener('error',()=>{diag('SDK_LOAD_ERROR',{src:sdk.src});setStatus('Не удалось загрузить SDK VK ID. Проверь подключение или блокировщик.')});
  if(window.VKIDSDK){diag('SDK_ALREADY_AVAILABLE',{sdkPresent:true});init()}else diag('WAITING_FOR_SDK',{src:sdk.src});
 }else diag('SDK_SCRIPT_TAG_MISSING');
 window.addEventListener('error',event=>diag('WINDOW_ERROR',{message:event.message,filename:event.filename,lineno:event.lineno}));
 window.addEventListener('unhandledrejection',event=>diag('UNHANDLED_REJECTION',{reason:String(event.reason?.message||event.reason)}));
})();
</script>
</body>
</html>
