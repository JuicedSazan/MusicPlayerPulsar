name: Validate remote VK browser
on:
  push:
    branches: [feature/vk-remote-browser-login]
  pull_request:
    branches: [web-v1.2.0]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m py_compile server.py vk_remote_browser.py
      - name: Check browser JavaScript syntax
        run: node --check app.js
